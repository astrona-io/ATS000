# Course manifest for ATS000 - Getting Started.
#
# Six sections (010 to 060), one entry each under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone, with its quiz, closes the section.
# Playgrounds are not listed: the landing page's playground marker shows them.
# solution.md is never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS000
  title: Getting Started
  description: >
    Your first Astrona labs: how a lab is started, worked on and graded, on
    problems small enough to finish in minutes, then how to scale, label and
    launch a fleet from a file and how to find why pods stay Pending or crash.
    It then covers terminal and YAML basics, the full Astrona CLI workflow, the
    core kubectl calls, ConfigMaps and Secrets, rollouts and rollback, and a
    troubleshooting method. Start here if you have never used the Astrona CLI,
    kubectl or a terminal much. Each module pairs a reader with an ungraded playground, and each
    section closes with a capstone and a knowledge check.

modules:

  - id: module-010
    title: "Your First Lab"
    description: >
      How an Astrona lab works, end to end, on the smallest possible problem:
      start it, look at the cluster with kubectl, fix one thing, submit it for
      grading and clean up.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
