# Astrona training manifest for ATS000.

training:
  id: ATS000
  title: Getting Started
  description: >
    Your first Astrona labs: how a lab is started, worked on and graded, on
    problems small enough to finish in minutes. Start here if you have never
    used the Astrona CLI, kubectl or a terminal much.

sections:
  - id: section-010
    title: "Your First Lab"
    path: sections/section-010/README.md
    modules:
      - id: module-01
        title: "The Lab Loop: Run, Look, Fix, Submit"
        content:
          - type: reading
            title: "Module 1: The lab loop"
            path: sections/section-010/module-01/course.md
          - type: lab
            title: "Your First Lab: Bring A Deployment Back To Life"
            path: sections/section-010/module-01/labs/lab-01
            difficulty: beginner
