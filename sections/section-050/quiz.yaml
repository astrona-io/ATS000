# Knowledge check for section 050. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats000-050"
course_id: "ATS000"
status: "draft"
provenance: "Original practice material written for this course."
scope:
  type: "section"
  id: "section-050"
  title: "ConfigMaps, Secrets And Rollouts"
questions:
- id: "ats000-050-q01"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Create a ConfigMap"
  source_readings:
  - "sections/section-050/module-01/course-01-create-a-configmap.md"
  prompt: "Which command makes a ConfigMap with the key `colour`?"
  options:
  - id: "a"
    text: "`kubectl create configmap site-extra --from-literal=colour=green`"
    explanation: "Correct. `--from-literal` sets a key and a value."
  - id: "b"
    text: "`kubectl create secret site-extra colour=green`"
    explanation: "Not this one. `--from-literal` sets a key and a value."
  - id: "c"
    text: "`kubectl get configmap colour=green`"
    explanation: "Not this one. `--from-literal` sets a key and a value."
  - id: "d"
    text: "`kubectl label configmap colour=green`"
    explanation: "Not this one. `--from-literal` sets a key and a value."
  correct_option: "a"
  explanation: "`--from-literal` sets a key and a value."
- id: "ats000-050-q02"
  type: "single_choice"
  difficulty: "intermediate"
  learning_objective: "Know when settings update"
  source_readings:
  - "sections/section-050/module-01/course-02-use-settings-in-a-ship.md"
  prompt: "You edit a ConfigMap used as environment variables. When does a running pod see it?"
  options:
  - id: "a"
    text: "At once"
    explanation: "Not this one. Variables are read once at start. Restart the Deployment."
  - id: "b"
    text: "Never"
    explanation: "Not this one. Variables are read once at start. Restart the Deployment."
  - id: "c"
    text: "After the pod is restarted"
    explanation: "Correct. Variables are read once at start. Restart the Deployment."
  - id: "d"
    text: "After one minute"
    explanation: "Not this one. Variables are read once at start. Restart the Deployment."
  correct_option: "c"
  explanation: "Variables are read once at start. Restart the Deployment."
- id: "ats000-050-q03"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Explain base64"
  source_readings:
  - "sections/section-050/module-01/course-03-secrets-and-base64.md"
  prompt: "What is base64 in a Secret?"
  options:
  - id: "a"
    text: "A strong encryption"
    explanation: "Not this one. It is not protection."
  - id: "b"
    text: "An encoding that anyone can decode"
    explanation: "Correct. It is not protection."
  - id: "c"
    text: "A password"
    explanation: "Not this one. It is not protection."
  - id: "d"
    text: "A compression"
    explanation: "Not this one. It is not protection."
  correct_option: "b"
  explanation: "It is not protection."
- id: "ats000-050-q04"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Write a Secret in YAML"
  source_readings:
  - "sections/section-050/module-01/course-03-secrets-and-base64.md"
  prompt: "Which field lets you write a Secret value in plain text in a file?"
  options:
  - id: "a"
    text: "`plainData`"
    explanation: "Not this one. Kubernetes encodes `stringData` for you."
  - id: "b"
    text: "`binary`"
    explanation: "Not this one. Kubernetes encodes `stringData` for you."
  - id: "c"
    text: "`value`"
    explanation: "Not this one. Kubernetes encodes `stringData` for you."
  - id: "d"
    text: "`stringData`"
    explanation: "Correct. Kubernetes encodes `stringData` for you."
  correct_option: "d"
  explanation: "Kubernetes encodes `stringData` for you."
- id: "ats000-050-q05"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Recognise a missing ConfigMap"
  source_readings:
  - "sections/section-050/module-01/course-04-when-the-settings-are-missing.md"
  prompt: "A pod shows `CreateContainerConfigError`. What is the likely cause?"
  options:
  - id: "a"
    text: "The image tag is wrong"
    explanation: "Not this one. Describe the pod to see which object is named."
  - id: "b"
    text: "The node has no memory"
    explanation: "Not this one. Describe the pod to see which object is named."
  - id: "c"
    text: "A ConfigMap, Secret or key it refers to is missing"
    explanation: "Correct. Describe the pod to see which object is named."
  - id: "d"
    text: "The Service has no endpoints"
    explanation: "Not this one. Describe the pod to see which object is named."
  correct_option: "c"
  explanation: "Describe the pod to see which object is named."
- id: "ats000-050-q06"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Explain what starts a rollout"
  source_readings:
  - "sections/section-050/module-02/course-01-how-a-rollout-works.md"
  prompt: "Which change starts a new rollout?"
  options:
  - id: "a"
    text: "A change to the pod template, such as the image"
    explanation: "Correct. Only a template change creates a new ReplicaSet."
  - id: "b"
    text: "A change of `replicas`"
    explanation: "Not this one. Only a template change creates a new ReplicaSet."
  - id: "c"
    text: "Reading the Deployment"
    explanation: "Not this one. Only a template change creates a new ReplicaSet."
  - id: "d"
    text: "Listing the pods"
    explanation: "Not this one. Only a template change creates a new ReplicaSet."
  correct_option: "a"
  explanation: "Only a template change creates a new ReplicaSet."
- id: "ats000-050-q07"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Watch a rollout"
  source_readings:
  - "sections/section-050/module-02/course-02-change-a-release-and-watch-it.md"
  prompt: "Which command waits for a rollout to finish?"
  options:
  - id: "a"
    text: "`kubectl rollout history deployment/shuttle`"
    explanation: "Not this one. `rollout status` follows the rollout until it is done."
  - id: "b"
    text: "`kubectl get rollout`"
    explanation: "Not this one. `rollout status` follows the rollout until it is done."
  - id: "c"
    text: "`kubectl logs deployment/shuttle`"
    explanation: "Not this one. `rollout status` follows the rollout until it is done."
  - id: "d"
    text: "`kubectl rollout status deployment/shuttle`"
    explanation: "Correct. `rollout status` follows the rollout until it is done."
  correct_option: "d"
  explanation: "`rollout status` follows the rollout until it is done."
- id: "ats000-050-q08"
  type: "single_choice"
  difficulty: "intermediate"
  learning_objective: "Roll back a release"
  source_readings:
  - "sections/section-050/module-02/course-03-undo-a-bad-release.md"
  prompt: "What does `kubectl rollout undo` return to the Deployment?"
  options:
  - id: "a"
    text: "Only the previous image"
    explanation: "Not this one. It restores the full older template."
  - id: "b"
    text: "The whole previous pod template"
    explanation: "Correct. It restores the full older template."
  - id: "c"
    text: "Only the previous replica count"
    explanation: "Not this one. It restores the full older template."
  - id: "d"
    text: "The previous namespace"
    explanation: "Not this one. It restores the full older template."
  correct_option: "b"
  explanation: "It restores the full older template."
- id: "ats000-050-q09"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Batch changes"
  source_readings:
  - "sections/section-050/module-02/course-04-pause-restart-and-stuck-rollouts.md"
  prompt: "How do you make several changes as one release?"
  options:
  - id: "a"
    text: "Restart after each change"
    explanation: "Not this one. While paused, changes are collected."
  - id: "b"
    text: "Delete the Deployment"
    explanation: "Not this one. While paused, changes are collected."
  - id: "c"
    text: "Pause, change, then resume"
    explanation: "Correct. While paused, changes are collected."
  - id: "d"
    text: "Scale to zero"
    explanation: "Not this one. While paused, changes are collected."
  correct_option: "c"
  explanation: "While paused, changes are collected."
- id: "ats000-050-q10"
  type: "single_choice"
  difficulty: "intermediate"
  learning_objective: "Recognise a stuck rollout"
  source_readings:
  - "sections/section-050/module-02/course-04-pause-restart-and-stuck-rollouts.md"
  prompt: "A rollout never finishes. What do you usually see?"
  options:
  - id: "a"
    text: "Old pods still running and new pods not ready"
    explanation: "Correct. Old pods keep serving until new ones are ready."
  - id: "b"
    text: "All pods deleted"
    explanation: "Not this one. Old pods keep serving until new ones are ready."
  - id: "c"
    text: "No ReplicaSets"
    explanation: "Not this one. Old pods keep serving until new ones are ready."
  - id: "d"
    text: "A new namespace"
    explanation: "Not this one. Old pods keep serving until new ones are ready."
  correct_option: "a"
  explanation: "Old pods keep serving until new ones are ready."
