apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: rollout-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: RELEASE
              value: one
