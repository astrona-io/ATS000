# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# ConfigMaps And Secrets (PLAYGROUND).
# A clean sandbox with a ConfigMap, a Secret and a Deployment that uses both, as
# variables and as files. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-000-playground-050-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    preloadImages:
      - nginx:1.27-alpine

bootstrap:
  manifests:
    - name: config-lab namespace with a ConfigMap, a Secret and the site Deployment
      type: folder
      source: manifests/
  waitFor:
    - resource: nodes
      all: true

teardown:
  keepCluster: false
