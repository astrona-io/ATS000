# lock needs the Secret lock-key, which does not exist yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lock
  namespace: cargo-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lock
  template:
    metadata:
      labels:
        app: lock
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: PIN
              valueFrom:
                secretKeyRef:
                  name: lock-key
                  key: PIN
