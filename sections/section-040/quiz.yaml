# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats000-040"
course_id: "ATS000"
status: "draft"
provenance: "Original practice material written for this course."
scope:
  type: "section"
  id: "section-040"
  title: "The Astrona CLI And The kubectl Toolkit"
questions:
- id: "ats000-040-q01"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Sign in and check the account"
  source_readings:
  - "sections/section-040/module-01/course-01-sign-in-find-a-lab-and-run-it.md"
  prompt: "Which command shows who the CLI is signed in as?"
  options:
  - id: "a"
    text: "`astrona whoami`"
    explanation: "Correct. `astrona whoami` prints the account."
  - id: "b"
    text: "`astrona status`"
    explanation: "Not this one. `astrona whoami` prints the account."
  - id: "c"
    text: "`astrona list`"
    explanation: "Not this one. `astrona whoami` prints the account."
  - id: "d"
    text: "`astrona progress`"
    explanation: "Not this one. `astrona whoami` prints the account."
  correct_option: "a"
  explanation: "`astrona whoami` prints the account."
- id: "ats000-040-q02"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Start a lab"
  source_readings:
  - "sections/section-040/module-01/course-01-sign-in-find-a-lab-and-run-it.md"
  prompt: "Which command builds a fresh cluster for a catalog lab?"
  options:
  - id: "a"
    text: "`astrona submit <lab name>`"
    explanation: "Not this one. `astrona run` starts the lab."
  - id: "b"
    text: "`astrona reset <lab name>`"
    explanation: "Not this one. `astrona run` starts the lab."
  - id: "c"
    text: "`astrona run <lab name>`"
    explanation: "Correct. `astrona run` starts the lab."
  - id: "d"
    text: "`astrona use <lab name>`"
    explanation: "Not this one. `astrona run` starts the lab."
  correct_option: "c"
  explanation: "`astrona run` starts the lab."
- id: "ats000-040-q03"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Work in the lab shell"
  source_readings:
  - "sections/section-040/module-01/course-02-inside-a-lab-shell-docs-and-switching.md"
  prompt: "Why do you work in `astrona shell`?"
  options:
  - id: "a"
    text: "It is faster than a normal terminal"
    explanation: "Not this one. The lab shell makes sure kubectl talks to the lab and not to another cluster."
  - id: "b"
    text: "Its kubectl is pointed at the lab cluster"
    explanation: "Correct. The lab shell makes sure kubectl talks to the lab and not to another cluster."
  - id: "c"
    text: "It grades your work"
    explanation: "Not this one. The lab shell makes sure kubectl talks to the lab and not to another cluster."
  - id: "d"
    text: "It hides the task"
    explanation: "Not this one. The lab shell makes sure kubectl talks to the lab and not to another cluster."
  correct_option: "b"
  explanation: "The lab shell makes sure kubectl talks to the lab and not to another cluster."
- id: "ats000-040-q04"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Read feedback from submit"
  source_readings:
  - "sections/section-040/module-01/course-03-submit-and-read-the-hints.md"
  prompt: "What does a hint next to a failed check do?"
  options:
  - id: "a"
    text: "Fixes the check for you"
    explanation: "Not this one. A hint is a pointer. You make the fix."
  - id: "b"
    text: "Gives the full solution"
    explanation: "Not this one. A hint is a pointer. You make the fix."
  - id: "c"
    text: "Shows your score"
    explanation: "Not this one. A hint is a pointer. You make the fix."
  - id: "d"
    text: "Tells you where to look, without the answer"
    explanation: "Correct. A hint is a pointer. You make the fix."
  correct_option: "d"
  explanation: "A hint is a pointer. You make the fix."
- id: "ats000-040-q05"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Clean up environments"
  source_readings:
  - "sections/section-040/module-01/course-04-start-over-and-clean-up.md"
  prompt: "How do you remove an environment you no longer need?"
  options:
  - id: "a"
    text: "`astrona stop <path>`"
    explanation: "Not this one. `destroy` removes the environment by its name."
  - id: "b"
    text: "`astrona reset --soft`"
    explanation: "Not this one. `destroy` removes the environment by its name."
  - id: "c"
    text: "`astrona destroy <name>`, with the name from `astrona list`"
    explanation: "Correct. `destroy` removes the environment by its name."
  - id: "d"
    text: "`kubectl delete cluster`"
    explanation: "Not this one. `destroy` removes the environment by its name."
  correct_option: "c"
  explanation: "`destroy` removes the environment by its name."
- id: "ats000-040-q06"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Look at all namespaces"
  source_readings:
  - "sections/section-040/module-02/course-01-planets-and-namespaces.md"
  prompt: "Which flag lists objects of every namespace?"
  options:
  - id: "a"
    text: "`-A`"
    explanation: "Correct. `-A` means all namespaces. `-n` picks one."
  - id: "b"
    text: "`-n`"
    explanation: "Not this one. `-A` means all namespaces. `-n` picks one."
  - id: "c"
    text: "`-o`"
    explanation: "Not this one. `-A` means all namespaces. `-n` picks one."
  - id: "d"
    text: "`-l`"
    explanation: "Not this one. `-A` means all namespaces. `-n` picks one."
  correct_option: "a"
  explanation: "`-A` means all namespaces. `-n` picks one."
- id: "ats000-040-q07"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Print one field"
  source_readings:
  - "sections/section-040/module-02/course-02-shape-the-output-with-o.md"
  prompt: "Which command prints only the replica count of `beacon`?"
  options:
  - id: "a"
    text: "`kubectl get deployment beacon -n harbor -o wide`"
    explanation: "Not this one. `-o jsonpath` prints the fields you name."
  - id: "b"
    text: "`kubectl describe replicas beacon`"
    explanation: "Not this one. `-o jsonpath` prints the fields you name."
  - id: "c"
    text: "`kubectl get beacon --replicas`"
    explanation: "Not this one. `-o jsonpath` prints the fields you name."
  - id: "d"
    text: "`kubectl get deployment beacon -n harbor -o jsonpath='{.spec.replicas}'`"
    explanation: "Correct. `-o jsonpath` prints the fields you name."
  correct_option: "d"
  explanation: "`-o jsonpath` prints the fields you name."
- id: "ats000-040-q08"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Read the log of a previous run"
  source_readings:
  - "sections/section-040/module-02/course-03-describe-events-and-logs.md"
  prompt: "A container restarts and its log is empty. What do you add to `kubectl logs`?"
  options:
  - id: "a"
    text: "`-A`"
    explanation: "Not this one. `--previous` shows the log of the last finished run."
  - id: "b"
    text: "`--previous`"
    explanation: "Correct. `--previous` shows the log of the last finished run."
  - id: "c"
    text: "`-o yaml`"
    explanation: "Not this one. `--previous` shows the log of the last finished run."
  - id: "d"
    text: "`--watch`"
    explanation: "Not this one. `--previous` shows the log of the last finished run."
  correct_option: "b"
  explanation: "`--previous` shows the log of the last finished run."
- id: "ats000-040-q09"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Run a command inside a pod"
  source_readings:
  - "sections/section-040/module-02/course-04-exec-and-port-forward.md"
  prompt: "What does the `--` in `kubectl exec` do?"
  options:
  - id: "a"
    text: "Makes the command run twice"
    explanation: "Not this one. Everything after `--` runs inside the container."
  - id: "b"
    text: "Opens a port"
    explanation: "Not this one. Everything after `--` runs inside the container."
  - id: "c"
    text: "Separates kubectl flags from the command in the pod"
    explanation: "Correct. Everything after `--` runs inside the container."
  - id: "d"
    text: "Prints the log"
    explanation: "Not this one. Everything after `--` runs inside the container."
  correct_option: "c"
  explanation: "Everything after `--` runs inside the container."
- id: "ats000-040-q10"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Reach a Service from your computer"
  source_readings:
  - "sections/section-040/module-02/course-04-exec-and-port-forward.md"
  prompt: "Which command makes local port 8080 lead to port 80 of the Service `beacon`?"
  options:
  - id: "a"
    text: "`kubectl port-forward service/beacon 8080:80 -n harbor`"
    explanation: "Correct. The form is `local:remote`."
  - id: "b"
    text: "`kubectl expose service/beacon 8080:80`"
    explanation: "Not this one. The form is `local:remote`."
  - id: "c"
    text: "`kubectl exec service/beacon 8080:80`"
    explanation: "Not this one. The form is `local:remote`."
  - id: "d"
    text: "`kubectl proxy 8080:80`"
    explanation: "Not this one. The form is `local:remote`."
  correct_option: "a"
  explanation: "The form is `local:remote`."
