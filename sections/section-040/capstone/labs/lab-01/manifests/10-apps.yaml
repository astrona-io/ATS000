# relay-a has one ship but should have three.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-a
  namespace: deck-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-a
  template:
    metadata:
      labels:
        app: relay-a
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
# relay-b exits at once until the variable MODE is set to on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-b
  namespace: deck-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-b
  template:
    metadata:
      labels:
        app: relay-b
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["sh", "-c", "if [ \"$MODE\" != on ]; then echo 'MODE is not set to on' >&2; exit 1; fi; exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
---
# relay-c asks for far more memory than any launch pad has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-c
  namespace: deck-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-c
  template:
    metadata:
      labels:
        app: relay-c
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 512Gi
