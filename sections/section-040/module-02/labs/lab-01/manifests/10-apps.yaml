apiVersion: apps/v1
kind: Deployment
metadata:
  name: hatch
  namespace: bay-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hatch
  template:
    metadata:
      labels:
        app: hatch
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drone
  template:
    metadata:
      labels:
        app: drone
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
