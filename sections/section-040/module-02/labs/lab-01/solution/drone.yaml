apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone
  namespace: outpost
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drone
  template:
    metadata:
      labels:
        app: drone
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
