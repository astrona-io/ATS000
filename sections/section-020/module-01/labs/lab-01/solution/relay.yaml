apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: launch-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
        tier: front
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: launch-lab
spec:
  selector:
    app: relay
  ports:
    - port: 80
      targetPort: 80
