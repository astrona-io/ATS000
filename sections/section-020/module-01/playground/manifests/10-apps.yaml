apiVersion: apps/v1
kind: Deployment
metadata:
  name: crew
  namespace: fleet-lab
  labels: {app: crew}
spec:
  replicas: 1
  selector:
    matchLabels: {app: crew}
  template:
    metadata:
      labels: {app: crew}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: fleet-lab
  labels: {app: cargo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: cargo}
  template:
    metadata:
      labels: {app: cargo}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
