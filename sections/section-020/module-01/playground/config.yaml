# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Scale, Label And Launch From A File (PLAYGROUND). A clean sandbox with two
# healthy fleet orders on the planet `fleet-lab`. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-000-playground-020-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    preloadImages:
      - nginx:1.27-alpine

bootstrap:
  manifests:
    - name: fleet-lab namespace with the crew and cargo Deployments
      type: folder
      source: manifests/
  waitFor:
    - resource: nodes
      all: true
    - resource: deploy/crew
      namespace: fleet-lab
    - resource: deploy/cargo
      namespace: fleet-lab

teardown:
  keepCluster: false
