apiVersion: apps/v1
kind: Deployment
metadata:
  name: crew
  namespace: orbit-lab
spec:
  replicas: 3
  selector:
    matchLabels: {app: crew}
  template:
    metadata:
      labels: {app: crew, tier: front}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: crew
  namespace: orbit-lab
spec:
  selector: {app: crew}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hauler
  namespace: orbit-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: hauler}
  template:
    metadata:
      labels: {app: hauler}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flicker
  namespace: orbit-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: flicker}
  template:
    metadata:
      labels: {app: flicker}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
