# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Find Why Ships Will Not Fly (PLAYGROUND). A clean sandbox with two broken
# fleet orders on the planet `rescue-lab`: one pod cannot be placed
# (Pending) and one keeps crashing (CrashLoopBackOff). No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-000-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    preloadImages:
      - nginx:1.27-alpine

bootstrap:
  manifests:
    - name: rescue-lab namespace with the broken hauler and flicker Deployments
      type: folder
      source: manifests/
  waitFor:
    - resource: nodes
      all: true

teardown:
  keepCluster: false
