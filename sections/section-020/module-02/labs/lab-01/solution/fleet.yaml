apiVersion: apps/v1
kind: Deployment
metadata:
  name: hauler
  namespace: rescue-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: hauler}
  template:
    metadata:
      labels: {app: hauler}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flicker
  namespace: rescue-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: flicker}
  template:
    metadata:
      labels: {app: flicker}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
