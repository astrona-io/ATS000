apiVersion: apps/v1
kind: Deployment
metadata:
  name: north
  namespace: shell-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: north
  template:
    metadata:
      labels:
        app: north
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
