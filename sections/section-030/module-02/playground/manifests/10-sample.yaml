apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: draft-lab
  labels:
    tier: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      labels:
        app: sample
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: LEVEL
              value: "low"
