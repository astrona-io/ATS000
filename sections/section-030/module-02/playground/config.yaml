# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Read And Write YAML (PLAYGROUND).
# A clean sandbox with one healthy Deployment, `sample`, to read as YAML and
# to copy ideas from. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-000-playground-030-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    preloadImages:
      - nginx:1.27-alpine

bootstrap:
  manifests:
    - name: draft-lab namespace with a sample Deployment
      type: folder
      source: manifests/
  waitFor:
    - resource: nodes
      all: true

teardown:
  keepCluster: false
