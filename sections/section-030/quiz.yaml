# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats000-030"
course_id: "ATS000"
status: "draft"
provenance: "Original practice material written for this course."
scope:
  type: "section"
  id: "section-030"
  title: "Read The Terminal And YAML"
questions:
- id: "ats000-030-q01"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Show where you are in the file system with pwd"
  source_readings:
  - "sections/section-030/module-01/course-01-where-you-are-paths-and-folders.md"
  prompt: "Which command prints the folder you are in?"
  options:
  - id: "a"
    text: "`pwd`"
    explanation: "Correct. `pwd` prints the working directory. `ls` lists what is in it."
  - id: "b"
    text: "`ls`"
    explanation: "Not this one. `pwd` prints the working directory. `ls` lists what is in it."
  - id: "c"
    text: "`cd`"
    explanation: "Not this one. `pwd` prints the working directory. `ls` lists what is in it."
  - id: "d"
    text: "`mkdir`"
    explanation: "Not this one. `pwd` prints the working directory. `ls` lists what is in it."
  correct_option: "a"
  explanation: "`pwd` prints the working directory. `ls` lists what is in it."
- id: "ats000-030-q02"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Tell absolute and relative paths apart"
  source_readings:
  - "sections/section-030/module-01/course-01-where-you-are-paths-and-folders.md"
  prompt: "Which path is an absolute path?"
  options:
  - id: "a"
    text: "`missions/day1`"
    explanation: "Not this one. An absolute path starts with `/` and works from any folder."
  - id: "b"
    text: "`../missions`"
    explanation: "Not this one. An absolute path starts with `/` and works from any folder."
  - id: "c"
    text: "`/home/astro/missions`"
    explanation: "Correct. An absolute path starts with `/` and works from any folder."
  - id: "d"
    text: "`./notes.txt`"
    explanation: "Not this one. An absolute path starts with `/` and works from any folder."
  correct_option: "c"
  explanation: "An absolute path starts with `/` and works from any folder."
- id: "ats000-030-q03"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Make and read files"
  source_readings:
  - "sections/section-030/module-01/course-02-make-read-and-move-files.md"
  prompt: "Which command shows the last lines of a file?"
  options:
  - id: "a"
    text: "`head notes.txt`"
    explanation: "Not this one. `tail` shows the end of a file. `head` shows the start."
  - id: "b"
    text: "`tail notes.txt`"
    explanation: "Correct. `tail` shows the end of a file. `head` shows the start."
  - id: "c"
    text: "`touch notes.txt`"
    explanation: "Not this one. `tail` shows the end of a file. `head` shows the start."
  - id: "d"
    text: "`cp notes.txt`"
    explanation: "Not this one. `tail` shows the end of a file. `head` shows the start."
  correct_option: "b"
  explanation: "`tail` shows the end of a file. `head` shows the start."
- id: "ats000-030-q04"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Use a pipe and grep"
  source_readings:
  - "sections/section-030/module-01/course-03-pipes-and-filters.md"
  prompt: "Which command lists only the lines of the pod list that contain `Running`?"
  options:
  - id: "a"
    text: "`kubectl get pods > Running`"
    explanation: "Not this one. A pipe `|` sends the output of the first command into `grep`."
  - id: "b"
    text: "`kubectl get pods & grep Running`"
    explanation: "Not this one. A pipe `|` sends the output of the first command into `grep`."
  - id: "c"
    text: "`grep Running | kubectl get pods`"
    explanation: "Not this one. A pipe `|` sends the output of the first command into `grep`."
  - id: "d"
    text: "`kubectl get pods | grep Running`"
    explanation: "Correct. A pipe `|` sends the output of the first command into `grep`."
  correct_option: "d"
  explanation: "A pipe `|` sends the output of the first command into `grep`."
- id: "ats000-030-q05"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Save output in a file"
  source_readings:
  - "sections/section-030/module-01/course-03-pipes-and-filters.md"
  prompt: "What is the difference between `>` and `>>`?"
  options:
  - id: "a"
    text: "`>` adds to the end, `>>` replaces the file"
    explanation: "Not this one. A single `>` overwrites the file. Use `>>` to append."
  - id: "b"
    text: "They are the same"
    explanation: "Not this one. A single `>` overwrites the file. Use `>>` to append."
  - id: "c"
    text: "`>` replaces the file, `>>` adds to its end"
    explanation: "Correct. A single `>` overwrites the file. Use `>>` to append."
  - id: "d"
    text: "`>` reads a file, `>>` writes a file"
    explanation: "Not this one. A single `>` overwrites the file. Use `>>` to append."
  correct_option: "c"
  explanation: "A single `>` overwrites the file. Use `>>` to append."
- id: "ats000-030-q06"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Set and use a variable"
  source_readings:
  - "sections/section-030/module-01/course-04-variables-and-editing.md"
  prompt: "After `NS=vault-lab`, which command lists the Deployments of that namespace?"
  options:
  - id: "a"
    text: "`kubectl get deployments -n $NS`"
    explanation: "Correct. `$NS` gives the value of the variable. Without `$` the shell passes the word `NS`."
  - id: "b"
    text: "`kubectl get deployments -n NS`"
    explanation: "Not this one. `$NS` gives the value of the variable. Without `$` the shell passes the word `NS`."
  - id: "c"
    text: "`kubectl get deployments -n (NS)`"
    explanation: "Not this one. `$NS` gives the value of the variable. Without `$` the shell passes the word `NS`."
  - id: "d"
    text: "`kubectl get deployments -n $(NS`"
    explanation: "Not this one. `$NS` gives the value of the variable. Without `$` the shell passes the word `NS`."
  correct_option: "a"
  explanation: "`$NS` gives the value of the variable. Without `$` the shell passes the word `NS`."
- id: "ats000-030-q07"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Read maps and lists"
  source_readings:
  - "sections/section-030/module-02/course-01-maps-lists-and-indentation.md"
  prompt: "In YAML, what starts an item of a list?"
  options:
  - id: "a"
    text: "A colon"
    explanation: "Not this one. A dash followed by a space starts a list item."
  - id: "b"
    text: "A hash sign"
    explanation: "Not this one. A dash followed by a space starts a list item."
  - id: "c"
    text: "A tab"
    explanation: "Not this one. A dash followed by a space starts a list item."
  - id: "d"
    text: "A dash and a space"
    explanation: "Correct. A dash followed by a space starts a list item."
  correct_option: "d"
  explanation: "A dash followed by a space starts a list item."
- id: "ats000-030-q08"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Indent YAML correctly"
  source_readings:
  - "sections/section-030/module-02/course-01-maps-lists-and-indentation.md"
  prompt: "How should you indent YAML?"
  options:
  - id: "a"
    text: "With one tab per level"
    explanation: "Not this one. YAML does not accept tabs for indentation. Use two spaces per level."
  - id: "b"
    text: "With spaces, never tabs"
    explanation: "Correct. YAML does not accept tabs for indentation. Use two spaces per level."
  - id: "c"
    text: "With any mix of tabs and spaces"
    explanation: "Not this one. YAML does not accept tabs for indentation. Use two spaces per level."
  - id: "d"
    text: "Not at all"
    explanation: "Not this one. YAML does not accept tabs for indentation. Use two spaces per level."
  correct_option: "b"
  explanation: "YAML does not accept tabs for indentation. Use two spaces per level."
- id: "ats000-030-q09"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Quote values that must be strings"
  source_readings:
  - "sections/section-030/module-02/course-02-strings-numbers-and-quotes.md"
  prompt: "An environment variable must hold the text 3. How do you write it?"
  options:
  - id: "a"
    text: "`value: 3`"
    explanation: "Not this one. Without quotes YAML reads a number, and the field wants a string."
  - id: "b"
    text: "`value: three`"
    explanation: "Not this one. Without quotes YAML reads a number, and the field wants a string."
  - id: "c"
    text: "`value: \"3\"`"
    explanation: "Correct. Without quotes YAML reads a number, and the field wants a string."
  - id: "d"
    text: "`value: (3)`"
    explanation: "Not this one. Without quotes YAML reads a number, and the field wants a string."
  correct_option: "c"
  explanation: "Without quotes YAML reads a number, and the field wants a string."
- id: "ats000-030-q10"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Check a file with a dry run"
  source_readings:
  - "sections/section-030/module-02/course-04-check-a-file-before-you-launch-it.md"
  prompt: "Which command checks a file without creating anything?"
  options:
  - id: "a"
    text: "`kubectl apply --dry-run=client -f file.yaml`"
    explanation: "Correct. A dry run reads the file and does not change the cluster."
  - id: "b"
    text: "`kubectl apply -f file.yaml`"
    explanation: "Not this one. A dry run reads the file and does not change the cluster."
  - id: "c"
    text: "`kubectl delete -f file.yaml`"
    explanation: "Not this one. A dry run reads the file and does not change the cluster."
  - id: "d"
    text: "`kubectl get -f file.yaml --create`"
    explanation: "Not this one. A dry run reads the file and does not change the cluster."
  correct_option: "a"
  explanation: "A dry run reads the file and does not change the cluster."
