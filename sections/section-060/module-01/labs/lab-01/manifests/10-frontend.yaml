apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mixed-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
# front has the wrong selector (app: front) and the wrong targetPort (8080).
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: mixed-lab
spec:
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 8080
