# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# A Troubleshooting Method (PLAYGROUND).
# A clean sandbox with five small faults on the planet `clinic-lab`, one for each
# common status. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-000-playground-060-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    preloadImages:
      - nginx:1.27-alpine

bootstrap:
  manifests:
    - name: clinic-lab namespace with five small faults
      type: folder
      source: manifests/
  waitFor:
    - resource: nodes
      all: true

teardown:
  keepCluster: false
