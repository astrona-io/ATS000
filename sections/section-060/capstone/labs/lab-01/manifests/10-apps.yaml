# alpha: misspelled image tag. beta: memory request too big. gamma: needs MODE=on.
# delta: the Service selects app=delta, but the pods have app=delta-web.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha
  namespace: drill-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha
  template:
    metadata:
      labels:
        app: alpha
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpne
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta
  namespace: drill-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta
  template:
    metadata:
      labels:
        app: beta
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 512Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamma
  namespace: drill-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamma
  template:
    metadata:
      labels:
        app: gamma
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["sh", "-c", "if [ \"$MODE\" != on ]; then echo 'MODE is not set to on' >&2; exit 1; fi; exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delta-web
  namespace: drill-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delta-web
  template:
    metadata:
      labels:
        app: delta-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: delta
  namespace: drill-lab
spec:
  selector:
    app: delta
  ports:
    - port: 80
      targetPort: 80
