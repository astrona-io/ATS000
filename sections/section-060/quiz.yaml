# Knowledge check for section 060. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: "question_bank"
id: "ats000-060"
course_id: "ATS000"
status: "draft"
provenance: "Original practice material written for this course."
scope:
  type: "section"
  id: "section-060"
  title: "A Troubleshooting Method"
questions:
- id: "ats000-060-q01"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Follow the method"
  source_readings:
  - "sections/section-060/module-01/course-01-the-four-step-method.md"
  prompt: "What is the correct order of the method?"
  options:
  - id: "a"
    text: "Look, narrow, read the clue, smallest fix"
    explanation: "Correct. Never skip to a fix before you read the clue."
  - id: "b"
    text: "Fix, look, narrow, read"
    explanation: "Not this one. Never skip to a fix before you read the clue."
  - id: "c"
    text: "Delete, apply, look, fix"
    explanation: "Not this one. Never skip to a fix before you read the clue."
  - id: "d"
    text: "Read, fix, fix, look"
    explanation: "Not this one. Never skip to a fix before you read the clue."
  correct_option: "a"
  explanation: "Never skip to a fix before you read the clue."
- id: "ats000-060-q02"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Fix the right object"
  source_readings:
  - "sections/section-060/module-01/course-01-the-four-step-method.md"
  prompt: "A pod is broken and belongs to a Deployment. What do you fix?"
  options:
  - id: "a"
    text: "The pod"
    explanation: "Not this one. The Deployment would replace an edited pod."
  - id: "b"
    text: "The node"
    explanation: "Not this one. The Deployment would replace an edited pod."
  - id: "c"
    text: "The Deployment"
    explanation: "Correct. The Deployment would replace an edited pod."
  - id: "d"
    text: "The namespace"
    explanation: "Not this one. The Deployment would replace an edited pod."
  correct_option: "c"
  explanation: "The Deployment would replace an edited pod."
- id: "ats000-060-q03"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Read ImagePullBackOff"
  source_readings:
  - "sections/section-060/module-01/course-02-read-the-pod-status.md"
  prompt: "A pod shows `ImagePullBackOff`. Where do you look?"
  options:
  - id: "a"
    text: "`kubectl logs`"
    explanation: "Not this one. The container never started, so there is no log."
  - id: "b"
    text: "`kubectl describe pod`, Events"
    explanation: "Correct. The container never started, so there is no log."
  - id: "c"
    text: "`kubectl top`"
    explanation: "Not this one. The container never started, so there is no log."
  - id: "d"
    text: "`kubectl rollout history`"
    explanation: "Not this one. The container never started, so there is no log."
  correct_option: "b"
  explanation: "The container never started, so there is no log."
- id: "ats000-060-q04"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Read Pending"
  source_readings:
  - "sections/section-060/module-01/course-02-read-the-pod-status.md"
  prompt: "A pod is `Pending` and the event mentions insufficient memory. What is the cause?"
  options:
  - id: "a"
    text: "The image tag is wrong"
    explanation: "Not this one. The scheduler cannot place the pod."
  - id: "b"
    text: "A Secret is missing"
    explanation: "Not this one. The scheduler cannot place the pod."
  - id: "c"
    text: "The Service selector is wrong"
    explanation: "Not this one. The scheduler cannot place the pod."
  - id: "d"
    text: "Its request is larger than any node can give"
    explanation: "Correct. The scheduler cannot place the pod."
  correct_option: "d"
  explanation: "The scheduler cannot place the pod."
- id: "ats000-060-q05"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Read CrashLoopBackOff"
  source_readings:
  - "sections/section-060/module-01/course-02-read-the-pod-status.md"
  prompt: "Which command shows why a crashing container fell over?"
  options:
  - id: "a"
    text: "`kubectl get nodes`"
    explanation: "Not this one. The previous log holds the last words of the program."
  - id: "b"
    text: "`kubectl get endpoints`"
    explanation: "Not this one. The previous log holds the last words of the program."
  - id: "c"
    text: "`kubectl logs <pod> --previous`"
    explanation: "Correct. The previous log holds the last words of the program."
  - id: "d"
    text: "`kubectl cluster-info`"
    explanation: "Not this one. The previous log holds the last words of the program."
  correct_option: "c"
  explanation: "The previous log holds the last words of the program."
- id: "ats000-060-q06"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Read empty endpoints"
  source_readings:
  - "sections/section-060/module-01/course-03-services-and-endpoints.md"
  prompt: "A Service has no endpoints but its pods are Running and ready. What do you compare?"
  options:
  - id: "a"
    text: "The Service selector and the pod labels"
    explanation: "Correct. No match means no endpoints."
  - id: "b"
    text: "The node names"
    explanation: "Not this one. No match means no endpoints."
  - id: "c"
    text: "The image names"
    explanation: "Not this one. No match means no endpoints."
  - id: "d"
    text: "The namespace creation time"
    explanation: "Not this one. No match means no endpoints."
  correct_option: "a"
  explanation: "No match means no endpoints."
- id: "ats000-060-q07"
  type: "single_choice"
  difficulty: "intermediate"
  learning_objective: "Check the target port"
  source_readings:
  - "sections/section-060/module-01/course-03-services-and-endpoints.md"
  prompt: "The endpoints list addresses, but traffic fails. What may be wrong?"
  options:
  - id: "a"
    text: "The Deployment name"
    explanation: "Not this one. The Service must send traffic to the port the container listens on."
  - id: "b"
    text: "The cluster version"
    explanation: "Not this one. The Service must send traffic to the port the container listens on."
  - id: "c"
    text: "The Secret type"
    explanation: "Not this one. The Service must send traffic to the port the container listens on."
  - id: "d"
    text: "The `targetPort` is not the container port"
    explanation: "Correct. The Service must send traffic to the port the container listens on."
  correct_option: "d"
  explanation: "The Service must send traffic to the port the container listens on."
- id: "ats000-060-q08"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Keep good habits"
  source_readings:
  - "sections/section-060/module-01/course-04-notes-and-habits.md"
  prompt: "What should you do after a fix?"
  options:
  - id: "a"
    text: "Close the terminal"
    explanation: "Not this one. A fix is proven by the status."
  - id: "b"
    text: "Run the same command again to verify"
    explanation: "Correct. A fix is proven by the status."
  - id: "c"
    text: "Delete the namespace"
    explanation: "Not this one. A fix is proven by the status."
  - id: "d"
    text: "Assume it worked"
    explanation: "Not this one. A fix is proven by the status."
  correct_option: "b"
  explanation: "A fix is proven by the status."
- id: "ats000-060-q09"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Change one thing"
  source_readings:
  - "sections/section-060/module-01/course-04-notes-and-habits.md"
  prompt: "Why change one thing at a time?"
  options:
  - id: "a"
    text: "It is faster"
    explanation: "Not this one. Several changes hide the cause."
  - id: "b"
    text: "kubectl allows only one"
    explanation: "Not this one. Several changes hide the cause."
  - id: "c"
    text: "To know which change fixed it"
    explanation: "Correct. Several changes hide the cause."
  - id: "d"
    text: "It saves memory"
    explanation: "Not this one. Several changes hide the cause."
  correct_option: "c"
  explanation: "Several changes hide the cause."
- id: "ats000-060-q10"
  type: "single_choice"
  difficulty: "beginner"
  learning_objective: "Fix a fault"
  source_readings:
  - "sections/section-060/module-01/course-01-the-four-step-method.md"
  prompt: "Why not delete a broken pod to fix it?"
  options:
  - id: "a"
    text: "Its Deployment makes the same pod again"
    explanation: "Correct. The fault is in the template."
  - id: "b"
    text: "Pods cannot be deleted"
    explanation: "Not this one. The fault is in the template."
  - id: "c"
    text: "It deletes the namespace"
    explanation: "Not this one. The fault is in the template."
  - id: "d"
    text: "It deletes the Service"
    explanation: "Not this one. The fault is in the template."
  correct_option: "a"
  explanation: "The fault is in the template."
