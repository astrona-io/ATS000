# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# The Lab Loop (PLAYGROUND). A clean sandbox: it starts, applies a healthy
# app and a broken one on the planet `first-lab`, and then stays running for
# free exploration. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-000-playground-010-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    preloadImages:
      - nginx:1.27-alpine

# What the learner starts with: a healthy `hello` Deployment and a `relay`
# Deployment whose image tag has a typo, so its pod waits in ImagePullBackOff.
bootstrap:
  manifests:
    - name: first-lab namespace, hello and relay
      type: folder
      source: manifests/
  waitFor:
    - resource: nodes
      all: true
    - resource: deploy/hello
      namespace: first-lab

teardown:
  keepCluster: false
