# The starting state: one letter is missing from the image tag ("alpne"),
# so Kubernetes cannot pull it and both pods wait in ImagePullBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: first-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: hello}
  template:
    metadata:
      labels: {app: hello}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpne
          ports: [{containerPort: 80}]
