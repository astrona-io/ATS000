apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: dock
spec:
  replicas: 2
  selector:
    matchLabels: {app: scout}
  template:
    metadata:
      labels: {app: scout}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: hangar
spec:
  replicas: 3
  selector:
    matchLabels: {app: cargo}
  template:
    metadata:
      labels: {app: cargo}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
